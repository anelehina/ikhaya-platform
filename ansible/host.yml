---
# Manages ikhaya's host configuration from Git.
# Always dry-run first: ansible-playbook host.yml -K --check --diff
- name: Manage ikhaya host configuration
  hosts: homelab
  become: true
  gather_facts: false

  vars:
    alloy_version: "1.21.0-1"

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

  tasks:
    - name: Wi-Fi power-saving hook is in place
      ansible.builtin.copy:
        src: files/50-wifi-powersave-off
        dest: /etc/networkd-dispatcher/routable.d/50-wifi-powersave-off
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in folder for networkd-dispatcher exists
      ansible.builtin.file:
        path: /etc/systemd/system/networkd-dispatcher.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: networkd-dispatcher starts only after the Wi-Fi rename
      ansible.builtin.copy:
        src: files/networkd-dispatcher-after-wifi.conf
        dest: /etc/systemd/system/networkd-dispatcher.service.d/10-after-wifi-rename.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Safety-net service and timer for Wi-Fi power-saving
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - wifi-powersave-off.service
        - wifi-powersave-off.timer
      notify: Reload systemd

    - name: Apply systemd changes before enabling the timer
      ansible.builtin.meta: flush_handlers

    - name: Safety-net timer is enabled and running
      ansible.builtin.systemd_service:
        name: wifi-powersave-off.timer
        enabled: true
        state: started

    - name: Alloy is installed at the pinned version
      ansible.builtin.apt:
        name: "alloy={{ alloy_version }}"
        state: present
        allow_change_held_packages: true

    - name: Alloy is held so apt upgrade cannot change it
      ansible.builtin.dpkg_selections:
        name: alloy
        selection: hold

    - name: Alloy config matches Git
      ansible.builtin.copy:
        src: files/config.alloy
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: Restart alloy
