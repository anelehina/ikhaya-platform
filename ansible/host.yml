---
# Manages ikhaya's host configuration from Git.
# Always dry-run first: ansible-playbook host.yml -K --check --diff
- name: Manage ikhaya host configuration
  hosts: homelab
  become: true
  gather_facts: false

  vars:
    alloy_version: "1.21.0-1"

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # No module does "reload, or restart if reload isn't possible", so this
    # stays a command; it runs only after sshd -t has passed.
    - name: Reload ssh
      ansible.builtin.command: systemctl reload-or-restart ssh.service  # noqa: command-instead-of-module
      changed_when: true

  tasks:
    - name: Wi-Fi power-saving hook is in place
      ansible.builtin.copy:
        src: files/50-wifi-powersave-off
        dest: /etc/networkd-dispatcher/routable.d/50-wifi-powersave-off
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in folder for networkd-dispatcher exists
      ansible.builtin.file:
        path: /etc/systemd/system/networkd-dispatcher.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in makes networkd-dispatcher start after the Wi-Fi rename
      ansible.builtin.copy:
        src: files/networkd-dispatcher-after-wifi.conf
        dest: /etc/systemd/system/networkd-dispatcher.service.d/10-after-wifi-rename.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Safety-net service and timer for Wi-Fi power-saving
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - wifi-powersave-off.service
        - wifi-powersave-off.timer
      notify: Reload systemd

    - name: Scheduled health check service (path filled in at run time, not stored in Git)
      ansible.builtin.template:
        src: templates/ikhaya-check.service.j2
        dest: /etc/systemd/system/ikhaya-check.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Scheduled health check timer
      ansible.builtin.copy:
        src: files/ikhaya-check.timer
        dest: /etc/systemd/system/ikhaya-check.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Apply systemd changes before enabling the timers
      ansible.builtin.meta: flush_handlers

    - name: Safety-net timer is enabled and running
      ansible.builtin.systemd_service:
        name: wifi-powersave-off.timer
        enabled: true
        state: started

    - name: Health check timer is enabled and running
      ansible.builtin.systemd_service:
        name: ikhaya-check.timer
        enabled: true
        state: started

    - name: Battery charge-limit service is in place
      ansible.builtin.copy:
        src: files/battery-charge-limit.service
        dest: /etc/systemd/system/battery-charge-limit.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Apply systemd changes before enabling the battery service
      ansible.builtin.meta: flush_handlers

    - name: Battery charge limit is applied at every boot
      ansible.builtin.systemd_service:
        name: battery-charge-limit.service
        enabled: true
        state: started

    # --- SSH second factor (ADR 0006) ---------------------------------------
    - name: TOTP module for PAM is installed
      ansible.builtin.apt:
        name: libpam-google-authenticator
        state: present

    - name: Check the TOTP secret exists before SSH starts asking for codes
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.google_authenticator"
      register: totp_secret

    - name: Stop here until the one-time-code app is enrolled
      ansible.builtin.fail:
        msg: >-
          No ~/.google_authenticator yet. Enroll first (google-authenticator, as your own user,
          no sudo), save the emergency codes, then run host.yml again. Nothing about SSH was changed.
      when: not totp_secret.stat.exists

    - name: SSH stops asking for the account password (key + code only)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^@include common-auth'
        line: '# @include common-auth   (disabled by Ansible: SSH uses a key plus a one-time code, ADR 0006)'
        backup: true
      notify: Reload ssh

    - name: SSH asks for a one-time code
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sshd
        line: 'auth required pam_google_authenticator.so'
        insertafter: 'disabled by Ansible: SSH uses a key plus a one-time code'
        backup: true
      notify: Reload ssh

    - name: SSH hardening drop-in matches Git (key AND code)
      ansible.builtin.copy:
        src: files/sshd-10-hardening.conf
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Whole SSH configuration is valid before reloading
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      check_mode: false

    - name: Alloy is installed at the pinned version
      ansible.builtin.apt:
        name: "alloy={{ alloy_version }}"
        state: present
        allow_change_held_packages: true

    - name: Alloy is held so apt upgrade cannot change it
      ansible.builtin.dpkg_selections:
        name: alloy
        selection: hold

    - name: Alloy config matches Git
      ansible.builtin.copy:
        src: files/config.alloy
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: Restart alloy
