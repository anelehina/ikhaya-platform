---
# Read-only health check for ikhaya. Changes nothing.
# Run from the ansible/ folder: ansible-playbook check.yml -K
- name: Check ikhaya matches its intended state
  hosts: homelab
  become: true
  gather_facts: true

  tasks:
    - name: Show OS and kernel
      ansible.builtin.debug:
        msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}, kernel {{ ansible_facts['kernel'] }}"

    - name: Read UFW status
      ansible.builtin.command: ufw status verbose
      register: ufw
      changed_when: false

    - name: UFW is active and denies incoming by default
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw.stdout"
          - "'deny (incoming)' in ufw.stdout"
        success_msg: "UFW active, default deny incoming"
        fail_msg: "UFW is not in the expected state"

    - name: Read effective SSH settings
      ansible.builtin.command: sshd -T
      register: sshd
      changed_when: false

    - name: SSH allows keys only and no root login
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd.stdout"
          - "'permitrootlogin no' in sshd.stdout"
        success_msg: "SSH: keys only, root login off"
        fail_msg: "SSH hardening is missing"

    - name: Read Wi-Fi power-saving state
      ansible.builtin.command: iw dev wlp2s0 get power_save
      register: powersave
      changed_when: false

    - name: Wi-Fi power-saving is off
      ansible.builtin.assert:
        that:
          - "'Power save: off' in powersave.stdout"
        success_msg: "Wi-Fi power-saving off"
        fail_msg: "Wi-Fi power-saving is ON - check the networkd-dispatcher hook"

    - name: Collect service states
      ansible.builtin.service_facts:

    - name: Core services are running
      ansible.builtin.assert:
        that:
          - "ansible_facts.services[item].state == 'running'"
        success_msg: "{{ item }} running"
        fail_msg: "{{ item }} is NOT running"
      loop:
        - docker.service
        - tailscaled.service
        - alloy.service

    - name: Vaultwarden answers on localhost
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/alive
        status_code: 200