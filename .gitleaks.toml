# gitleaks: secret scanning plus ikhaya's own rules (decision 29).
# Default rules catch keys and tokens; the rules below catch details that
# aren't secrets but must still stay out of a public repo.
[extend]
useDefault = true

[[rules]]
id = "home-directory-path"
description = "Absolute home path reveals a username"
regex = '''/home/([a-z_][a-z0-9_-]*)/'''
secretGroup = 1
keywords = ["/home/"]

[[rules]]
id = "private-ip-address"
description = "Private, CGNAT or Tailscale IP address"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01])|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''
[rules.allowlist]
regexes = ['''127\.0\.0\.1''']

[[rules]]
id = "tailnet-name"
description = "Real Tailscale tailnet name"
regex = '''\btail[0-9a-f]{4,}\.ts\.net\b'''

[[rules]]
id = "grafana-stack-host"
description = "Grafana Cloud stack hostname"
regex = '''\b[a-z]+[0-9]+\.grafana\.net\b'''

[[rules]]
id = "personal-email"
description = "Personal email address"
regex = '''\b[A-Za-z0-9._%+-]+@(?:gmail|googlemail|outlook|hotmail|yahoo|icloud)\.com\b'''

[[rules]]
id = "mac-address"
description = "Hardware MAC address"
regex = '''\b(?:[0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b'''

[[rules]]
id = "aws-sso-portal"
description = "AWS access portal URL"
regex = '''\b[a-z0-9-]+\.awsapps\.com\b'''
